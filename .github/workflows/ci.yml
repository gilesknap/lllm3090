name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # setuptools_scm needs history for the version
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - run: sphinx-build -W -b html docs docs/_build/html

  docs:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: sphinx-build -b html docs docs/_build/html
      # Kept as an ordinary artifact as well as a Pages one. A Pages artifact
      # is not downloadable when the deploy step is what failed, and that is
      # the case where the built HTML is the only evidence of what went wrong
      # -- the build itself already had to pass `-W` in `test` to get here.
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html
      - id: deploy
        uses: actions/deploy-pages@v4

  dist:
    uses: ./.github/workflows/_dist.yml

  pypi:
    needs: [test, dist]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/_pypi.yml
    # The only permission a trusted publish needs: an OIDC token proving to
    # PyPI that this workflow, in this repository, is who it claims to be.
    permissions:
      id-token: write
