<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lllm3090</title>
<style>
:root{--bg:#eef1f3;--card:#fff;--ink:#101820;--ink2:#5a6772;--rule:#d6dde3;
        --ok:#0a6b5c;--okbg:#ddede9;--bad:#a2341c;--badbg:#f7e0da;--warn:#7e5b0c;--warnbg:#f5ecd5;
        --mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
  @media(prefers-color-scheme:dark){:root{--bg:#0c1216;--card:#141d23;--ink:#e4eaee;--ink2:#a0afba;
        --rule:#253138;--ok:#58c4ac;--okbg:#103029;--bad:#e08066;--badbg:#33201a;--warn:#c9a24a;--warnbg:#2b2314}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);
       font-size:15px;line-height:1.5;padding:2rem 1rem}
  .wrap{max-width:44rem;margin:0 auto;display:flex;flex-direction:column;gap:1.25rem}
  h1{font-size:1.35rem;margin:0;letter-spacing:-.02em}
  .sub{color:var(--ink2);font-size:.8rem;margin:0}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:1rem 1.15rem}
  .row{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0;border-bottom:1px solid var(--rule)}
  .row:last-child{border-bottom:0}
  .k{color:var(--ink2);font-size:.8rem}
  .v{font-weight:600;text-align:right;word-break:break-all}
  .pill{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:.72rem;font-weight:700}
  .p-ok{background:var(--okbg);color:var(--ok)} .p-bad{background:var(--badbg);color:var(--bad)}
  .p-warn{background:var(--warnbg);color:var(--warn)}
  .models{display:flex;flex-direction:column;gap:.5rem;margin:.5rem 0 0}
  label.m{display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem;border:1px solid var(--rule);
          border-radius:5px;cursor:pointer}
  label.m:hover{border-color:var(--ok)}
  label.m.active{border-color:var(--ok);background:var(--okbg)}
  .m .nm{font-weight:700;flex:1} .m .sz{color:var(--ink2);font-size:.78rem}
  .m .kind{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;padding:.12rem .4rem;
    border-radius:3px;border:1px solid var(--rule);color:var(--ink2)}
  .btns{display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap}
  button{font-family:inherit;font-size:.85rem;font-weight:700;padding:.55rem 1.1rem;border-radius:5px;
         border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
  button.primary{background:var(--ok);color:var(--bg);border-color:var(--ok)}
  button:disabled{opacity:.45;cursor:not-allowed}
  pre{background:var(--bg);border:1px solid var(--rule);border-radius:5px;padding:.7rem;
      font-size:.75rem;overflow-x:auto;margin:.6rem 0 0;white-space:pre-wrap}
  .bar{height:5px;background:var(--rule);border-radius:99px;overflow:hidden;margin-top:.3rem}
  .bar i{display:block;height:100%;background:var(--ok)}
  .loghead{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.5rem}
  .loghead .ctl{display:flex;gap:.4rem;align-items:center}
  .loghead button{padding:.3rem .7rem;font-size:.72rem}
  #logbox{background:#0b1015;color:#cfe3dd;border:1px solid var(--rule);border-radius:5px;
    height:20rem;overflow-y:auto;padding:.6rem .7rem;font-size:.72rem;line-height:1.45;
    white-space:pre-wrap;word-break:break-word}
  #logbox div{padding:.02rem 0}
  #logbox .warn{color:#e0c26a} #logbox .err{color:#f08a70;font-weight:600}
  #logbox .good{color:#66d9bd} #logbox .dim{color:#7d8f98}
  #logbox .sep{color:#7d8f98;border-top:1px dashed #33454e;margin:.4rem 0;padding-top:.3rem}
  .dot{width:7px;height:7px;border-radius:99px;display:inline-block;background:var(--bad)}
  .dot.on{background:var(--ok)}
  .cat{display:flex;flex-direction:column;gap:1.1rem;margin-top:.9rem}
  .c{padding:.85rem .9rem;border:1px solid var(--rule);border-radius:6px}
  .c.no{opacity:.5}
  .chead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
  .c .nm{font-weight:700}
  .c .meta{color:var(--ink2);font-size:.74rem;flex:1;min-width:12rem}
  .c button{padding:.3rem .7rem;font-size:.74rem}
  .cact{margin-left:auto;display:flex;align-items:center;gap:.5rem}
  .tag{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;padding:.1rem .35rem;
       border-radius:3px;border:1px solid var(--rule);color:var(--ink2)}
  .note{color:var(--ink2);font-size:.74rem;margin:.45rem 0 0;line-height:1.55}
  .c details{margin-top:.55rem}
  .c .bar{margin-top:.6rem}
  details summary{cursor:pointer;font-size:.78rem;color:var(--ink2)}
  details[open] summary{margin-bottom:.15rem}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>lllm3090</h1>
    <p class="sub" id="sub">local models on one RTX 3090</p>
  </div>

  <div class="card">
    <div class="row"><span class="k">engine</span><span class="v" id="eng">-</span></div>
    <div class="row"><span class="k">model</span><span class="v" id="mdl">-</span></div>
    <div class="row"><span class="k">endpoint</span><span class="v">http://127.0.0.1:1919</span></div>
    <div class="row"><span class="k">VRAM</span><span class="v" id="vram">-</span></div>
    <div class="bar"><i id="vbar" style="width:0"></i></div>
  </div>

  <div class="card">
    <strong>Installed</strong>
    <div class="models" id="installed"></div>
    <p class="note" id="none" style="display:none">Nothing installed yet — pick one below.</p>
    <div class="btns">
      <button class="primary" id="start">Start</button>
      <button id="stop">Stop</button>
    </div>
    <pre id="last" style="display:none"></pre>
  </div>

  <div class="card">
    <strong>Available to download</strong>
    <p class="note">Sized for this card. Context figures assume a q8 KV cache.</p>
    <div class="cat" id="catalog"></div>
  </div>

  <div class="card">
    <div class="loghead"><strong>Engine log</strong><span class="k" id="logstate">connecting…</span></div>
    <pre id="log" style="max-height:22rem;overflow-y:auto">…</pre>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let sel = null, busy = false;

function fmtCtx(n){ return n >= 1024 ? Math.round(n/1024)+'k' : n; }

async function refresh(){
  let s;
  try { s = await (await fetch('/api/status')).json(); }
  catch { $('eng').textContent = 'panel unreachable'; return; }

  $('sub').textContent = 'local models on one RTX 3090 · v' + s.version;
  const e = s.engine;
  $('eng').innerHTML = e.running
    ? (e.answering ? '<span class="pill p-ok">running</span>'
                   : '<span class="pill p-warn">loading</span>')
    : '<span class="pill p-bad">stopped</span>';
  $('mdl').textContent = e.model || '—';

  if (s.vram){
    const pct = 100 * s.vram.used_mb / s.vram.total_mb;
    $('vram').textContent = `${(s.vram.used_mb/1024).toFixed(1)} / ${(s.vram.total_mb/1024).toFixed(0)} GiB`;
    $('vbar').style.width = pct + '%';
  }

  // installed models
  const inst = s.installed;
  $('none').style.display = inst.length ? 'none' : 'block';
  if (!sel && inst.length) sel = e.model || inst[0].name;
  $('installed').innerHTML = inst.map(m => `
    <label class="m ${m.name===sel?'active':''}">
      <input type="radio" name="m" value="${m.name}" ${m.name===sel?'checked':''}>
      <span class="nm">${m.name}</span><span class="sz">${m.gb} GB</span>
    </label>`).join('');
  $('installed').querySelectorAll('input').forEach(i => i.onchange = () => { sel = i.value; refresh(); });

  busy = s.busy;
  $('start').disabled = busy || !sel;
  $('stop').disabled  = busy || !e.running;
  if (s.last && s.last.action){
    $('last').style.display = 'block';
    $('last').textContent = `${s.last.ok ? 'ok' : 'FAILED'}: ${s.last.action}\n${s.last.detail}`;
  }

  // Catalogue: built once, then only the mutable parts are updated. Rewriting
  // innerHTML on every poll would close any <details> the reader had opened,
  // which is maddening while watching a download.
  const dls = Object.fromEntries(s.downloads.map(d => [d.id, d]));
  if (!$('catalog').dataset.built){
    $('catalog').innerHTML = s.catalog.map(c => `
      <div class="c ${c.fits?'':'no'}" id="c-${c.id}">
        <div class="chead">
          <span class="nm">${c.name}</span>
          <span class="tag">${c.kind}</span>
          <span class="meta">${c.gb} GB · ${fmtCtx(c.max_ctx)} × ${c.parallel} · ~${c.expected_tok_s} tok/s${c.verified?' (measured)':''}</span>
          <span class="cact" id="a-${c.id}"></span>
        </div>
        <div class="bar" id="b-${c.id}" style="display:none"><i></i></div>
        <p class="note" id="e-${c.id}" style="display:none;color:var(--bad)"></p>
        <details><summary>${c.params}</summary><p class="note">${c.notes}</p></details>
      </div>`).join('');
    $('catalog').dataset.built = 1;
  }
  s.catalog.forEach(c => {
    const d = dls[c.id], act = $('a-'+c.id), bar = $('b-'+c.id), err = $('e-'+c.id);
    if (!act) return;
    const busyDl = d && (d.state === 'downloading' || d.state === 'queued');
    const html = busyDl
      ? `<span class="k">${d.percent}% · ${d.rate_mib_s} MiB/s</span>
         <button onclick="cancelDl('${c.id}')">Cancel</button>`
      : c.installed ? `<span class="pill p-ok">installed</span>`
      : !c.fits     ? `<span class="pill p-bad">too big</span>`
      :               `<button onclick="download('${c.id}')">Download</button>`;
    if (act.dataset.html !== html){ act.innerHTML = html; act.dataset.html = html; }
    bar.style.display = busyDl ? 'block' : 'none';
    if (busyDl) bar.firstElementChild.style.width = d.percent + '%';
    const bad = d && d.state === 'error';
    err.style.display = bad ? 'block' : 'none';
    if (bad) err.textContent = d.detail;
  });
}

async function post(url){ try { await fetch(url, {method:'POST'}); } catch {} refresh(); }
function download(id){ post('/api/download/' + id); }
function cancelDl(id){ post('/api/download/' + id + '/cancel'); }
$('start').onclick = () => { $('start').disabled = true; post('/api/start?model=' + encodeURIComponent(sel)); };
$('stop').onclick  = () => { $('stop').disabled  = true; post('/api/stop'); };

// engine log over SSE
const log = $('log');
const es = new EventSource('/api/logstream');
es.onopen = () => $('logstate').textContent = 'streaming';
es.onerror = () => $('logstate').textContent = 'reconnecting…';
es.addEventListener('rotated', () => { log.textContent = ''; });
es.onmessage = ev => {
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  log.textContent += JSON.parse(ev.data) + '\n';
  if (atBottom) log.scrollTop = log.scrollHeight;
};

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
