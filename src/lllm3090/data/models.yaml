# Curated model list for a single RTX 3090 (24 GB, sm_86).
#
# Every entry has been checked to exist on HuggingFace and to fit the card with
# room for a usable context. Figures:
#
#   size_gb            download size, from the HuggingFace API
#   kv_kib_per_token   KV cache cost per token at f16, derived from the config:
#                      full_attention_layers x 2 (K,V) x kv_heads x head_dim x 2 bytes.
#                      Linear-attention (GatedDeltaNet) layers cost nothing per
#                      token; sliding-window layers are counted only where the
#                      engine provisions them per-token.
#   max_ctx            the model's own RoPE ceiling -- past it lies incoherence,
#                      not merely cost, so the panel never offers more.
#   expected_tok_s     decode rate on this card. verified: true means measured
#                      here; otherwise it is derived from memory bandwidth over
#                      bytes-read-per-token and should be treated as ±30%.
#
# The panel computes achievable context from size_gb and kv_kib_per_token at
# run time, so it stays honest if you run headless (~2.4 GiB more to spend).

models:
  - id: qwen3.8-27b
    name: Qwen3.8-27B
    repo: unsloth/Qwen3.8-27B-GGUF
    file: Qwen3.8-27B-UD-Q4_K_S.gguf
    size_gb: 15.36
    kind: dense
    params: 27B dense (64 layers, 16 full-attention + 48 linear)
    kv_kib_per_token: 64
    max_ctx: 262144
    expected_tok_s: 35
    chat_template: qwen3.8-27b.jinja
    verified: true
    tags: [general, coding, dense]
    notes: >-
      The dense option, and the slowest model here: 35 tok/s measured, against
      126 for Qwen3.6-35B-A3B. Every one of its 27B parameters is read per
      token where the sparse models read about 3B, which is the whole of the
      difference. Take it when you want a dense model's qualities per parameter
      and can afford a quarter of the speed. Cold prefill on a very long prompt
      is slow under Vulkan (~2 min at 80k); warm turns are fine at 3.5 s.

  - id: qwen3.6-35b-a3b
    name: Qwen3.6-35B-A3B
    repo: unsloth/Qwen3.6-35B-A3B-GGUF
    file: Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
    size_gb: 17.73
    kind: moe
    params: 35B total, 3B active (256 experts, 8 per token)
    kv_kib_per_token: 20
    max_ctx: 262144
    expected_tok_s: 126
    verified: true
    tags: [general, agentic, long-context, recommended]
    notes: >-
      Sparse: only 3B parameters are read per token, so it decodes far faster
      than its size suggests -- measured at 126 tok/s on a short prompt and
      112 at 40k, against the dense 27B's 35. Its hybrid attention also makes KV
      unusually cheap (20 KiB/token against the 27B's 64), which is what puts
      the full 262k context in reach -- 212k per conversation with a slot spare
      for a subagent. Cold prefill at 40k is 21 s, warm 0.1 s. The default
      recommendation: the fastest model that also reaches a full 262k context.
      gpt-oss-20b decodes faster at 160 tok/s, in 128k of room -- take that one
      if the work fits and speed matters more than the window.

  - id: qwen3.6-35b-a3b-q4ks
    name: Qwen3.6-35B-A3B-Q4KS
    repo: unsloth/Qwen3.6-35B-A3B-GGUF
    file: Qwen3.6-35B-A3B-UD-Q4_K_S.gguf
    size_gb: 20.89
    kind: moe
    params: 35B total, 3B active
    kv_kib_per_token: 20
    max_ctx: 262144
    expected_tok_s: 124
    verified: true
    tags: [general, agentic, quality]
    notes: >-
      The same model at a higher bit-rate -- K-quants rather than I-quants, about
      0.4 bits per weight more. Decodes the same (124 tok/s measured, against the
      IQ4_XS build's 126) but leaves far less room for KV: 61k per conversation
      against 212k. You are trading context for fidelity at no speed cost. Take
      it only if you have measured that IQ4_XS is not good enough for your work.

  - id: gpt-oss-20b
    name: gpt-oss-20b
    repo: ggml-org/gpt-oss-20b-GGUF
    file: gpt-oss-20b-MXFP4.gguf
    size_gb: 12.11
    kind: moe
    params: 21B total, 3.6B active
    kv_kib_per_token: 24
    max_ctx: 131072
    expected_tok_s: 160
    verified: true
    tags: [general, small, reasoning-effort, fastest]
    notes: >-
      Native MXFP4 -- this is the format the model was released in, not a
      re-quantisation, so nothing is lost in conversion. The fastest model here
      by a clear margin -- 160 tok/s measured on a short prompt, 113 at 40k --
      and small enough to leave most of the card free, so it gets four slots at
      its full 128k window. Cold prefill at 40k is 17 s, warm 0.1 s. Exposes a
      reasoning_effort control that changes output length rather than speed,
      which is the useful knob for agent work.

  - id: qwen3-8b
    name: Qwen3-8B
    repo: unsloth/Qwen3-8B-GGUF
    file: Qwen3-8B-Q4_K_M.gguf
    size_gb: 5.03
    kind: dense
    params: 8B dense
    kv_kib_per_token: 144
    max_ctx: 32768
    expected_tok_s: 115
    verified: true
    tags: [small, smoke-test]
    notes: >-
      A 5 GB download for checking the install works end to end before
      committing to a 15-20 GB one. 115 tok/s measured, but **too small for an
      agent harness**: its 32k window cannot hold Claude Code's ~40k system
      prompt, so `lllm3090 claude` refuses it. Fine from a lighter client.
      Note the KV cost per token is the highest here despite the small weights
      -- 36 full-attention layers with no linear or sliding layers to make them
      cheap. Size and context are independent.
