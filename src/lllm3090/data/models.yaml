# Curated model list for a single RTX 3090 (24 GB, sm_86).
#
# Every entry has been checked to exist on HuggingFace and to fit the card with
# room for a usable context. Figures:
#
#   size_gb            download size, from the HuggingFace API
#   kv_kib_per_token   KV cache cost per token at f16, derived from the config:
#                      full_attention_layers x 2 (K,V) x kv_heads x head_dim x 2 bytes.
#                      Linear-attention (GatedDeltaNet) layers cost nothing per
#                      token; sliding-window layers are counted only where the
#                      engine provisions them per-token.
#   max_ctx            the model's own RoPE ceiling -- past it lies incoherence,
#                      not merely cost, so the panel never offers more.
#   expected_tok_s     decode rate on this card, ON THE VULKAN ENGINE AND WITH
#                      WHATEVER SPECULATION SHIPS BY DEFAULT -- see
#                      config.REFERENCE_BACKEND. verified: true means measured
#                      here; otherwise it is derived from memory bandwidth over
#                      bytes-read-per-token and should be treated as ±30%.
#                      A speed is a speed *of* a configuration, and there is now
#                      more than one: the same dense 27B serves 54.8 tok/s under
#                      Vulkan and 84.9 under CUDA. So these are not portable
#                      across backends, and every surface that shows one says
#                      which backend it is talking about.
#
#   min_compute_capability
#                      optional, and rare. The oldest GPU architecture that can
#                      run the entry at all -- for a quantisation whose kernels
#                      only exist on newer silicon. It is the ONLY hardware
#                      requirement typed by hand here: everything about memory
#                      is arithmetic (catalog.min_vram_mib) and recomputes for
#                      whatever card is present, while a kernel that does not
#                      exist cannot be derived from a file size.
#
# The panel computes achievable context from size_gb and kv_kib_per_token at
# run time, so it stays honest if you run headless (~2.4 GiB more to spend).
#
# For the same reason, DO NOT quote a context figure in `notes`. Notes are
# judgement -- why someone would pick this entry over its neighbour -- and the
# numbers beside them are computed per card. Two entries here carried absolute
# figures that were correct when written and wrong by the time the driver
# reserve and the KV overhead factor landed; the row then contradicted itself.
#
# `lllm3090 sweep` produces new entries in this shape from a model's own
# config.json, with everything derivable filled in and nothing else invented.

models:
  - id: qwen3.8-27b
    name: Qwen3.8-27B
    repo: unsloth/Qwen3.8-27B-GGUF
    file: Qwen3.8-27B-UD-Q4_K_S.gguf
    size_gb: 15.36
    kind: dense
    params: 27B dense (64 layers, 16 full-attention + 48 linear)
    kv_kib_per_token: 64
    max_ctx: 262144
    expected_tok_s: 55
    chat_template: qwen3.8-27b.jinja
    verified: true
    tags: [general, coding, dense]
    notes: >-
      The dense option, and the slowest model here: 55 tok/s against 126 for
      Qwen3.6-35B-A3B. Every one of its 27B parameters is read per token where
      the sparse models read about 3B, which is the whole of the difference.
      Take it when you want a dense model's qualities per parameter and can
      afford half the speed. Cold prefill on a very long prompt is slow under
      Vulkan (~2 min at 80k); warm turns are fine at 3.5 s. It carries a
      multi-token prediction head, which is where 35 of those tok/s became 55.

  - id: qwen3.6-35b-a3b
    name: Qwen3.6-35B-A3B
    repo: unsloth/Qwen3.6-35B-A3B-GGUF
    file: Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
    size_gb: 17.73
    kind: moe
    params: 35B total, 3B active (256 experts, 8 per token)
    kv_kib_per_token: 20
    max_ctx: 262144
    expected_tok_s: 126
    verified: true
    tags: [general, agentic, long-context]
    notes: >-
      Sparse: only 3B parameters are read per token, so it decodes far faster
      than its size suggests -- measured at 126 tok/s on a short prompt and
      112 at 40k, against the dense 27B's 35. Its hybrid attention also makes KV
      unusually cheap (20 KiB/token against the 27B's 64), which is what puts
      the full 262k context in reach -- and on a text console it reaches the
      RoPE ceiling itself, with a slot spare for a subagent. The context
      figures beside this entry are computed for the card you are on; they are
      not quoted here, because a note cannot be recomputed and drifts the first
      time a reserve moves. Cold prefill at 40k is 21 s, warm 0.1 s. The default
      recommendation: the fastest model that also reaches a full 262k context.
      gpt-oss-20b decodes faster at 160 tok/s, in 128k of room -- take that one
      if the work fits and speed matters more than the window.

  - id: qwen3.6-35b-a3b-mtp
    name: Qwen3.6-35B-A3B-MTP
    repo: unsloth/Qwen3.6-35B-A3B-MTP-GGUF
    file: Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
    size_gb: 18.21
    kind: moe
    params: 35B total, 3B active (256 experts, 8 per token) + an MTP head
    kv_kib_per_token: 20
    max_ctx: 262144
    expected_tok_s: 172
    verified: true
    tags: [general, agentic, long-context, recommended]
    notes: >-
      The recommendation with its multi-token prediction head preserved. The
      model drafts its own next tokens and verifies them in one pass, which the
      engine turns on by itself once it sees the head in the file. Measured
      here: 130 tok/s without it, 172 with, and 180 on code editing -- the gain
      rises with how predictable the output is. The head costs 0.48 GB of
      weights, which comes out of the cache; on a text console that is free,
      because the window is already at the architecture's ceiling, and on a
      desktop it is the only reason to prefer the plain build. Speculation
      changes which token wins a near-tie, so output is not byte-identical to
      the plain build -- neither is the plain build with itself, twice.

  - id: qwen3.6-35b-a3b-q4ks
    name: Qwen3.6-35B-A3B-Q4KS
    repo: unsloth/Qwen3.6-35B-A3B-GGUF
    file: Qwen3.6-35B-A3B-UD-Q4_K_S.gguf
    size_gb: 20.89
    kind: moe
    params: 35B total, 3B active
    kv_kib_per_token: 20
    max_ctx: 262144
    expected_tok_s: 124
    verified: true
    tags: [general, agentic, quality]
    notes: >-
      The same model at a higher bit-rate -- K-quants rather than I-quants, about
      0.4 bits per weight more. Decodes the same (124 tok/s measured, against the
      IQ4_XS build's 126) but the extra 3 GB of weights comes straight out of the
      cache, and on a 24 GB card with a desktop running that is enough to drop
      it under the window an agent harness needs -- the panel marks it tight and
      says what card would clear it. Headless it is comfortable, and on a 32 GB
      card it is comfortable either way. You are trading context for fidelity at
      no speed cost: take it only if you have measured that IQ4_XS is not good
      enough for your work.

  - id: gpt-oss-20b
    name: gpt-oss-20b
    repo: ggml-org/gpt-oss-20b-GGUF
    file: gpt-oss-20b-MXFP4.gguf
    size_gb: 12.11
    kind: moe
    params: 21B total, 3.6B active
    kv_kib_per_token: 24
    max_ctx: 131072
    expected_tok_s: 160
    verified: true
    tags: [general, small, reasoning-effort, fastest]
    notes: >-
      Native MXFP4 -- this is the format the model was released in, not a
      re-quantisation, so nothing is lost in conversion. The fastest model here
      by a clear margin -- 160 tok/s measured on a short prompt, 113 at 40k --
      and small enough to leave most of the card free, so it reaches its full
      window with slots to spare. Cold prefill at 40k is 17 s, warm 0.1 s.
      Exposes a reasoning_effort control that changes output length rather than speed,
      which is the useful knob for agent work.

  - id: qwen3-8b
    name: Qwen3-8B
    repo: unsloth/Qwen3-8B-GGUF
    file: Qwen3-8B-Q4_K_M.gguf
    size_gb: 5.03
    kind: dense
    params: 8B dense
    kv_kib_per_token: 144
    max_ctx: 32768
    expected_tok_s: 115
    verified: true
    tags: [small, smoke-test]
    notes: >-
      A 5 GB download for checking the install works end to end before
      committing to a 15-20 GB one. 115 tok/s measured, but **too small for an
      agent harness**: its 32k window cannot hold Claude Code's ~40k system
      prompt, so `lllm3090 claude` refuses it. Fine from a lighter client.
      Note the KV cost per token is the highest here despite the small weights
      -- 36 full-attention layers with no linear or sliding layers to make them
      cheap. Size and context are independent.

  - id: gemma-4-26b-a4b
    name: Gemma-4-26B-A4B
    repo: unsloth/gemma-4-26B-A4B-it-GGUF
    file: gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
    size_gb: 17.01
    kind: moe
    params: 26B total, 4B active (128 experts, 8 per token)
    kv_kib_per_token: 20
    max_ctx: 262144
    expected_tok_s: 128
    mmproj: mmproj-F16.gguf
    mmproj_gb: 1.19
    verified: true
    tags: [general, agentic, long-context, vision]
    notes: >-
      The first entry here that is not a Qwen or a gpt-oss, and the closest
      thing to a peer for the recommendation: sparse, 4B active, and KV of 20
      KiB/token -- the same figure as Qwen3.6-35B-A3B. Measured at 128 tok/s,
      which is the 35B-A3B's 126 with vision on top, and a shorter window in
      exchange: the projector's weights and its own compute workspace both come
      out of the cache. Take this one when the work involves
      images, the 35B-A3B when it needs the longest window. Watch the KV
      derivation if you change the quant: Gemma keeps a separate geometry for
      its 5 full-attention layers (2 global KV heads, 512 head dim), and the
      flat config fields give 40 KiB/token, which would promise twice the
      context the card can hold.

  - id: muse-glimmer-30b
    name: Muse-Glimmer-30B
    repo: unsloth/Muse-Glimmer-30B-GGUF
    file: Muse-Glimmer-30B-UD-Q4_K_XL.gguf
    size_gb: 15.88
    kind: dense
    params: 30B dense (52 layers, 13 of them full-attention)
    kv_kib_per_token: 13
    max_ctx: 131072
    expected_tok_s: 44
    mmproj: mmproj-Muse-Glimmer-30B-Q8_0.gguf
    mmproj_gb: 2.05
    verified: true
    tags: [general, long-context, parallel, vision]
    notes: >-
      The cheapest KV cache in the catalogue at 13 KiB/token, which buys more
      concurrent conversations at full depth than anything else here -- how
      many depends on the card, and the panel is what says. The trade is that
      it is **dense**: all 30B parameters are read per token, and it measures
      44 tok/s against the sparse entries' 126-160. The narrowest entry in the
      catalogue: take it only when you genuinely want several long
      conversations at once and can wait for each. For one conversation,
      Gemma-4-26B-A4B is three times the speed with more context.

  - id: gemma-4-12b-qat
    name: Gemma-4-12B-QAT
    repo: unsloth/gemma-4-12B-it-qat-GGUF
    file: gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
    size_gb: 6.72
    kind: dense
    params: 12B dense, quantisation-aware trained
    kv_kib_per_token: 16
    max_ctx: 262144
    expected_tok_s: 84
    mmproj: mmproj-F16.gguf
    mmproj_gb: 0.18
    verified: true
    tags: [general, small, long-context, vision]
    notes: >-
      Quantisation-aware trained, so 4 bits is what it was trained for rather
      than something done to it afterwards -- the reason to prefer this over a
      post-quantised 12B. At 6.7 GB it leaves most of the card free and still
      reaches its full 262k ceiling with slots to spare. A better smoke test
      than Qwen3-8B, whose 32k window cannot hold an agent harness's system prompt,
      and small enough to sit alongside something else. 84 tok/s measured.

